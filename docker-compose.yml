services:
  backend-postgres:
    image: "postgres:${BACKEND_POSTGRES_VERSION:-13}"
    container_name: backend-postgres
    environment:
      POSTGRES_USER: ${BACKEND_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BACKEND_POSTGRES_PASSWORD}
      POSTGRES_DB: ${BACKEND_POSTGRES_DB}
    volumes:
      - backend-postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${BACKEND_POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  backend:
    build:
      context: ./backend
    command: ["--host", "0.0.0.0", "--port", "80"]
    environment:
      SERVER_URL: ${SERVER_URL}
      KAKAO_TOSS_PROMOTION_BLOCK_ID: ${KAKAO_TOSS_PROMOTION_BLOCK_ID:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DEVELOPER_ID: ${DEVELOPER_ID:-}
      PROMOTION_INLINE_CARD_ENABLED: ${PROMOTION_INLINE_CARD_ENABLED:-true}
      PROMOTION_INLINE_CARD_USER_IDS: ${PROMOTION_INLINE_CARD_USER_IDS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      PROMOTION_TRACKING_SECRET: ${PROMOTION_TRACKING_SECRET}
      TOSS_ACCESS_KEY: ${TOSS_ACCESS_KEY}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      TOSS_PUBLISHER_ID: ${TOSS_PUBLISHER_ID}
      TOSS_LIVE_RECOMMENDATIONS: ${TOSS_LIVE_RECOMMENDATIONS:-false}
      MENU_DATA_DIR: /data/menus
      DATABASE_URL: postgresql://${BACKEND_POSTGRES_USER}:${BACKEND_POSTGRES_PASSWORD}@backend-postgres:5432/${BACKEND_POSTGRES_DB}
    ports:
      - "80:80"
    volumes:
      - ./backend/app:/code/app/
      - ./backend/tests:/code/tests/
      - ./data:/data/menus
    depends_on:
      backend-postgres:
        condition: service_healthy
    restart: always

volumes:
  backend-postgres-db-volume:
